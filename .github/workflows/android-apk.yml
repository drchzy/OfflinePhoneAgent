# Android APK CI signed-update-test-2
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 1.0.${{ github.run_number }}
  KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/offline-phone-agent.jks

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing secrets
        shell: bash
        run: |
          if [ -n "$KEYSTORE_SET" ]; then
            DECODED=$(printf '%s' "$KEYSTORE_SET" | base64 --decode)
            ANDROID_KEYSTORE_BASE64=$(printf '%s' "$DECODED" | cut -d'|' -f1)
            ANDROID_KEYSTORE_PASSWORD=$(printf '%s' "$DECODED" | cut -d'|' -f2)
            ANDROID_KEY_ALIAS=$(printf '%s' "$DECODED" | cut -d'|' -f3)
            ANDROID_KEY_PASSWORD=$(printf '%s' "$DECODED" | cut -d'|' -f4)

            echo "::add-mask::$ANDROID_KEYSTORE_BASE64"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            echo "::add-mask::$ANDROID_KEY_ALIAS"
            echo "::add-mask::$ANDROID_KEY_PASSWORD"

            echo "ANDROID_KEYSTORE_BASE64=$ANDROID_KEYSTORE_BASE64" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing signing data: set KEYSTORE_SET or ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD"; exit 1; }

      - name: Build signed APK
        shell: bash
        run: |
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          gradle :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "OfflinePhoneAgent-v${APP_VERSION_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePhoneAgent-v${{ env.APP_VERSION_NAME }}-apk
          path: OfflinePhoneAgent-v${{ env.APP_VERSION_NAME }}.apk
          if-no-files-found: error

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: OfflinePhoneAgent v${{ env.APP_VERSION_NAME }}
          files: OfflinePhoneAgent-v${{ env.APP_VERSION_NAME }}.apk
          generate_release_notes: false
