name: Preview Android APK

on:
  push:
    branches: ["feat/compose-movie-20261017"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/offline-phone-agent.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set preview build version
        shell: bash
        run: |
          CODE=$((${{ github.run_number }} + 32))
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=1.0.$CODE-preview" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare existing release signing
        shell: bash
        run: |
          if [ -n "$KEYSTORE_SET" ]; then
            DECODED=$(printf '%s' "$KEYSTORE_SET" | base64 --decode)
            ANDROID_KEYSTORE_BASE64=$(printf '%s' "$DECODED" | cut -d'|' -f1)
            ANDROID_KEYSTORE_PASSWORD=$(printf '%s' "$DECODED" | cut -d'|' -f2)
            ANDROID_KEY_ALIAS=$(printf '%s' "$DECODED" | cut -d'|' -f3)
            ANDROID_KEY_PASSWORD=$(printf '%s' "$DECODED" | cut -d'|' -f4)
            echo "::add-mask::$ANDROID_KEYSTORE_BASE64"
            echo "::add-mask::$ANDROID_KEYSTORE_PASSWORD"
            echo "::add-mask::$ANDROID_KEY_ALIAS"
            echo "::add-mask::$ANDROID_KEY_PASSWORD"
            echo "ANDROID_KEYSTORE_BASE64=$ANDROID_KEYSTORE_BASE64" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Compile and sign release APK
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing; preview APK must use the existing production key."
            exit 1
          fi
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          # One compilation only: assembleRelease also verifies Kotlin / Compose.
          gradle :app:assembleRelease --stacktrace
          mkdir -p preview-apk
          cp app/build/outputs/apk/release/app-release.apk "preview-apk/OfflinePhoneAgent-v${APP_VERSION_NAME}.apk"
          echo "Existing release signing used"

      - name: Upload installable APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OfflinePhoneAgent-Compose-Movie-preview
          path: preview-apk/*.apk
          if-no-files-found: error

      - name: Validate signed preview output
        if: success()
        shell: bash
        run: test -f "preview-apk/OfflinePhoneAgent-v${APP_VERSION_NAME}.apk"

      - name: Create prerelease for in-app preview updates
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: OfflinePhoneAgent v${{ env.APP_VERSION_NAME }}
          prerelease: true
          make_latest: false
          generate_release_notes: false
          files: preview-apk/OfflinePhoneAgent-v${{ env.APP_VERSION_NAME }}.apk
