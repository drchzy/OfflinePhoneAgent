:18px;margin-top:9px}.triple i{font-size:28px;color:#168879}.muted{font-size:18px;color:#657d83;line-height:1.5}.cover .muted{color:#9fc1c3}footer{display:flex;justify-content:space-between;align-items:center;font-size:14px;letter-spacing:.5px;color:#76898c;border-top:1px solid #d9e2df;padding-top:12px;margin-top:10px}.cover footer{color:#9fc1c3;border-color:#46626a}#panel{width:330px;flex:none;height:100%;overflow:auto;background:#132534;border:1px solid #314759;color:#d6e4e8;padding:16px;border-radius:8px;display:none}body.prep #panel{display:block}#panel h3{font-size:15px;color:#79c8b6;margin:17px 0 8px}#panel p,#panel textarea{font-size:14px;line-height:1.6}textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #425b66;border-radius:4px;padding:10px;color:#dbe8ea;background:#0e1b25}#progress{position:fixed;bottom:0;height:3px;background:#51c3aa;transition:width .15s}#toc{max-width:270px}#clock{font-variant-numeric:tabular-nums}body.full #bar{display:none}body.full #workspace{height:100dvh;padding:0}body.full #panel{display:none}@media(max-width:900px){#panel{width:245px}#bar{gap:4px;padding:0 6px}button,select{padding:5px;font-size:12px}#toc{max-width:140px}}@media print{body{background:white}#bar,#panel,#progress{display:none!important}#workspace,#frame{display:block;height:auto;padding:0}#stage{position:static;transform:none!important;zoom:.7;box-shadow:none}}</style></head><body class="prep"><nav id="bar"><b>AI 研发实践 · V0.1</b><button id="prev">←</button><button id="next">→</button><select id="toc" aria-label="页面目录"></select><button id="mode">放映模式</button><button id="full">全屏</button><button id="timer">开始计时</button><span id="clock">00:00</span><span id="page"></span></nav><main id="workspace"><div id="frame"><section id="stage"></section></div><aside id="panel"><b>备赛工作区</b><h3>本页讲解词</h3><p id="notes"></p><h3>待补证据 / 内容</h3><p id="need"></p><h3>来源（盘点报告编号）</h3><p id="ev"></p><h3>我的补充（本机保存）</h3><textarea id="extra" placeholder="填写真实情况、证据、修改意见..."></textarea><button id="export">导出全部补充</button><p style="color:#8fa8b3">← → 翻页 · F 全屏 · N 切换备赛/放映 · Esc 退出全屏。补充内容仅保存在本机浏览器，导出后可用于下一版。</p></aside></main><div id="progress"></div><script>const slides=[{"ch": "开篇", "title": "从个人提效<br>到团队赋能", "sub": "AI 原生研发体系的构建与实践", "body": "<div class=\"hero-line\">以智慧文旅与科技馆业务为载体<br>把 AI 从代码生成工具，逐步转化为可复用的研发基础设施。<\/div><div class=\"hero-tags\"><span>真实业务<\/span><span>工程闭环<\/span><span>共享资产<\/span><\/div><p class=\"muted\">恒锋信息 · 2026 软件研发人员 AI 技能竞赛 · 备赛初稿<\/p>", "notes": "我今天汇报的不只是一个系统，而是从真实行业项目出发，将需求、架构、开发、故障处理中的AI实践沉淀为可复用研发能力的过程。", "need": "填写姓名、事业部、正式作品名称；确认本人贡献与展示授权。", "ev": "竞赛规则；00 / 99", "t": 17}, {"ch": "01 / 真实需求", "title": "票务交易不是简单的增删改查", "sub": "真实业务载体：科技馆管理与商城票务", "body": "<div class=\"cards\"><article><small>01<\/small><h3>业务一致性<\/h3><p>订单、支付、库存、出票、核销、售后必须使用一致的业务语义。<\/p><\/article><article><small>02<\/small><h3>复杂系统联调<\/h3><p>现有平台、独立商城、闸机与第三方渠道并存，兼容与权限边界不可轻易改变。<\/p><\/article><article><small>03<\/small><h3>研发知识重复消耗<\/h3><p>已有文旅项目的研发经验需要转为可查、可执行的规范，而不是留在个人会话。<\/p><\/article><\/div><div class=\"call\">需求来源与目标客户：待补真实需求提出者、合同属性、现场规模及当前运行状态。<\/div>", "notes": "先交代需求从哪里来，为什么业务不能用普通CRUD的思路。明确旧文旅与当前科技馆项目关系；不要把全部团队成果说成本人独立开发。", "need": "需求单/业主或产品沟通，合同内外属性，客户影响，个人职责与当前上线情况。", "ev": "01 · FZ001–FZ005 / SY010", "t": 46}, {"ch": "01 / 真实需求", "title": "在既有平台上构建交易能力", "sub": "项目架构与业务链路（依据源码和设计文档）", "body": "<div class=\"flow\"><div><b>商品 / SKU<\/b><span>多业态策略<\/span><\/div><div><b>库存<\/b><span>预占与结算<\/span><\/div><div><b>订单 / 支付<\/b><span>幂等与状态<\/span><\/div><div><b>票券 / 核销<\/b><span>履约<\/span><\/div><div><b>售后<\/b><span>退款回补<\/span><\/div><\/div><div class=\"cards\"><article><small>01<\/small><h3>平台兼容<\/h3><p>既有主工程与独立 Java 17 / Spring Boot 4 商城扩展共存。<\/p><\/article><article><small>02<\/small><h3>扩展设计<\/h3><p>统一核心交易域，业态策略与渠道 SPI 隔离。<\/p><\/article><article><small>03<\/small><h3>一致性设计<\/h3><p>消息削峰、延迟关单与 event_queue 补偿设计。<\/p><\/article><\/div>", "notes": "这里展示架构取舍：共性沉淀，业态差异隔离。运行证据中历史免费单验证与现版本部署是两回事。接下来用实际系统展示正常链路和异常提示。", "need": "补本人负责的模块、真实需求与方案取舍；准备独立脱敏环境中的实际业务运行（3分钟）。", "ev": "01 · FZ002–FZ005", "t": 50}, {"ch": "02 / 研发体系", "title": "AI 应用地图：贯穿研发生命周期", "sub": "从真实需求到经验反哺，重点不是每一步都自动化", "body": "<table><thead><tr><th>环节<\/th><th>AI 实际任务<\/th><th>人负责的关键决策<\/th><\/tr><\/thead><tbody><tr><td>需求 / 产品<\/td><td>任务拆分、配置交互、库存对账列<\/td><td>业务口径与验收标准<\/td><\/tr><tr><td>设计 / 架构<\/td><td>旧工程分析、策略/SPI、接口设计<\/td><td>架构边界与兼容性<\/td><\/tr><tr><td>前后端<\/td><td>生成 Skill、Controller/DTO → 页面<\/td><td>契约、权限、代码审查<\/td><\/tr><tr><td>联调 / 测试<\/td><td>数据库、浏览器、日志、测试脚本<\/td><td>真实结果与异常判断<\/td><\/tr><tr><td>交付 / 沉淀<\/td><td>部署定义、故障 SOP、规则更新<\/td><td>发布审批与复用范围<\/td><\/tr><\/tbody><\/table><div class=\"call\">证据覆盖以上环节；本次盘点未重新运行构建、测试或远程工具。<\/div>", "notes": "讲清实际用的 Claude、Codex、项目 Skill、MCP、Playwright 等；要补三环节提示词与输出、采纳理由。AI代码占比与返工估算缺失，需按样本补。", "need": "选需求、代码、调试三个原始AI会话；补 AI 代码生成占比与返工比重及估算口径。", "ev": "02 · E001–E015 / FZ007–008 / AI001–007", "t": 55}, {"ch": "02 / 研发体系", "title": "三层协作：让不同 AI 遵守相同边界", "sub": "已有个人反馈闭环；真实跨成员采纳待补证", "body": "<div class=\"layers\"><div><em>架构层<\/em><b>负责人定义需求、架构与验收<\/b><span>AI 方案推演 → 人工决策<\/span><\/div><div><em>开发层<\/em><b>按共享规范与任务卡执行<\/b><span>生成器 / MCP / Worker → 检查与修复<\/span><\/div><div><em>团队层<\/em><b>共享上下文与流程模板<\/b><span>AGENTS / Skills / 接口契约 / QA 与 Lead<\/span><\/div><\/div><div class=\"call\">反馈路径：实际错误 → 人工确认 → 更新规范 → 下一次研发复用。<\/div>", "notes": "区分一个人调多个AI与多个真实开发者使用AI。已有规范、派工、模板，下一步用真实同事的需求到验收链证明团队协作。", "need": "补一条真实成员调用共享 Skill、提交、审核并反馈规范的记录；确认 coco 及模板的原创增量。", "ev": "03 · SY003/SY004/FZ004/AI001–007", "t": 55}, {"ch": "03 / 核心实践", "title": "把复杂研发任务变成可执行的规格", "sub": "商城任务卡与项目级生成规范", "body": "<div class=\"stats\"><div><strong>74<\/strong><b>商城微任务卡<\/b><span>实际目录文件数<\/span><\/div><div><strong>4<\/strong><b>当前工程生成 Skill 文档<\/b><span>旧前后端与微服务前后端<\/span><\/div><div><strong>11<\/strong><b>历史文旅工程项目 Skill<\/b><span>逻辑能力登记<\/span><\/div><\/div><div class=\"flow\"><div><b>规格<\/b><span>目标/限制<\/span><\/div><div><b>任务卡<\/b><span>文件与验收<\/span><\/div><div><b>Agent<\/b><span>按规范执行<\/span><\/div><div><b>Review<\/b><span>检查实际结果<\/span><\/div><div><b>资产<\/b><span>规则反哺<\/span><\/div><\/div><div class=\"call\">前端从 Controller / DTO 读取契约；后端参考 POM、SQL、领域分层及依赖方向。<\/div>", "notes": "展示一张实际任务卡、一段前端生成Skill和对应接口。现有卡有模板插值残留，说明仍有人工检查需求。", "need": "选真实任务卡和相应代码；补本人的任务分解与AI输出对比；演示前修正或避开模板缺陷。", "ev": "01/03 · FZ004/FZ007–009 / SY003", "t": 42}, {"ch": "03 / 核心实践", "title": "Vibe Coding：产品自主迭代的下一层能力", "sub": "重点候选，当前盘点没有找到真实产品人员完整使用链", "body": "<div class=\"flow\"><div><b>产品需求<\/b><span>页面/交互<\/span><\/div><div><b>受控空间<\/b><span>限定文件与组件<\/span><\/div><div><b>AI 修改<\/b><span>生成与预览<\/span><\/div><div><b>研发审核<\/b><span>业务和接口边界<\/span><\/div><div><b>验收<\/b><span>提交/回退<\/span><\/div><\/div><div class=\"cards\"><article><small>01<\/small><h3>已具备的基础<\/h3><p>项目级生成规范、页面迭代、构建预览及角色分工资产。<\/p><\/article><article><small>02<\/small><h3>需要现场确认<\/h3><p>产品同学是否实际操作、可改范围、是否隔离工作区。<\/p><\/article><article><small>03<\/small><h3>不能提前宣称<\/h3><p>硬权限隔离、自动PR门禁、跨岗位零研发介入已实现。<\/p><\/article><\/div>", "notes": "领导最关注跨岗位赋能。若真实环境存在，现场由本人操作，且提前确认是否允许产品同学参与单人赛。没有证据前以方案和既有基础呈现。", "need": "补产品人员实际使用记录、环境截图/入口、改前改后、审核与回退证据；如能证实，可升级为主演示。", "ev": "03/08/12 · FZ008 / AI003–007 / AI011–014", "t": 42}, {"ch": "03 / 核心实践", "title": "案例一｜能访问，不等于修复了权限", "sub": "闸机拆服务后的 401：人否决 AI 绕权，重新定位真实根因", "body": "<div class=\"flow\"><div><b>故障<\/b><span>闸机后台访问异常<\/span><\/div><div><b>AI 初判<\/b><span>临时跳过权限<\/span><\/div><div><b>人工否决<\/b><span>必须保留权限校验<\/span><\/div><div><b>重新排查<\/b><span>启动类漏导入 SpringUtil<\/span><\/div><div><b>源码修复<\/b><span>补充 @Import<\/span><\/div><\/div><div class=\"call\">人的底线：不能用降低安全边界换取功能“正常”。<\/div><p class=\"muted\">历史回传有成功状态码；全部角色权限回归与最终原始日志待补。<\/p>", "notes": "先展示脱敏历史对话：AI提出临时绕权，用户明确拒绝；再打开启动类与变更记录。强调人的判断推动AI修复根因，不把历史结果伪装成现场执行。", "need": "最终提交SHA、管理员成功/普通角色拒绝测试、原始状态码与本人贡献；展示时隐藏内部地址。", "ev": "05 · E001–E004", "t": 71}, {"ch": "03 / 核心实践", "title": "案例二｜先统一口径，再判断出票恢复", "sub": "数据库连接异常后，区分原始受影响批次与动态未补清单", "body": "<div class=\"stats\"><div><strong>52<\/strong><b>固定批次主单<\/b><span>历史回传，非全站<\/span><\/div><div><strong>43<\/strong><b>已出票订单<\/b><span>固定批次<\/span><\/div><div><strong>9<\/strong><b>取消订单<\/b><span>固定批次<\/span><\/div><div><strong>112<\/strong><b>已出票张数<\/b><span>历史回传<\/span><\/div><\/div><div class=\"cards\"><article><small>01<\/small><h3>AI 负责<\/h3><p>提出链路假设、提供查询、持续复核原批次与当前清单。<\/p><\/article><article><small>02<\/small><h3>人负责<\/h3><p>否定错误统计解读、回传真实查询、确认实际票券。<\/p><\/article><article><small>03<\/small><h3>边界<\/h3><p>故障唯一根因未独立取证；已有恢复逻辑不能全部算本次AI新增。<\/p><\/article><\/div>", "notes": "讲清楚为什么不能以动态清单变短直接推断取消或修复；历史回传其他异常0，只适用固定批次。", "need": "补原始脱敏查询结果和实际故障日志；确认补偿机制当前版本与后续整改状态。", "ev": "05/06 · E005–E008", "t": 46}, {"ch": "03 / 核心实践", "title": "案例三｜从一次故障到日常对账能力", "sub": "多实例重复结算：按同一结算基准核对三类数据", "body": "<div class=\"triple\"><div><b>业务计数器<\/b><span>当前库存统计<\/span><\/div><i>↔<\/i><div><b>库存流水账<\/b><span>统一 SETTLED 基准<\/span><\/div><i>↔<\/i><div><b>实际票券<\/b><span>独立业务事实<\/span><\/div><\/div><div class=\"cards\"><article><small>01<\/small><h3>问题<\/h3><p>多个实例读取相同未结算页，历史文档记录重复应用增量。<\/p><\/article><article><small>02<\/small><h3>纠偏<\/h3><p>人工指出多实例线索；AI参与SQL与对账字段。<\/p><\/article><article><small>03<\/small><h3>沉淀<\/h3><p>新增票券库存数、对账库存数；5秒窗口避免假漂移。<\/p><\/article><\/div><div class=\"call\">已证据支持对账能力；不能据此宣称并发缺陷已彻底根治上线。<\/div>", "notes": "真实业务价值是从事后SQL排查到日常可观察。使用合成票券、流水和计数器演示差异，不访问生产。", "need": "固定对账版本、页面截图或独立环境；准备正常/异常样本及真实修复前后证据。", "ev": "05 · E012–E013", "t": 55}, {"ch": "04 / 工程治理", "title": "人机边界不是口号，而是可验证约束", "sub": "规则、技术控制、验收证据分层治理", "body": "<table><thead><tr><th>人必须负责<\/th><th>AI 可执行<\/th><th>工程验证<\/th><\/tr><\/thead><tbody><tr><td>需求与业务口径<\/td><td>需求解析、任务分解<\/td><td>验收标准与实际输出<\/td><\/tr><tr><td>权限、数据安全<\/td><td>代码检索、实现建议<\/td><td>角色拒绝测试、脱敏<\/td><\/tr><tr><td>架构、兼容性<\/td><td>代码生成、重构<\/td><td>契约检查、编译与回归<\/td><\/tr><tr><td>交付与生产处置<\/td><td>脚本与日志分析<\/td><td>人工审批、退出码与回滚<\/td><\/tr><\/tbody><\/table><div class=\"call\">现有软约束不等于文件沙箱；本地 verify 有退出码，CI 存在跳测试配置，不能宣称全链路质量门禁。<\/div>", "notes": "主动说明已知问题：权限中间件stub、部分任务卡残留、看板关键词推断、CI跳测试等。展示已实施控制与后续治理计划的区别。", "need": "补本地门禁运行日志与CI记录；清除展示凭据；明确保护公共组件与后端文件的技  class=\"call\">计时、样本和环境均须预先排练；不能用录屏代替真实运行。<\/div>", "notes": "这页是演示导航，不是演示本身。具体任务以环境验证为准，现场不要临时访问生产。若模型慢，缩小任务而非伪造结果。", "need": "确认可运行工程、合成数据、模型可用性、独立工作区、原始证据与全程计时。", "ev": "竞赛流程 1.4/1.6 · 10号报告", "t": 300}, {"ch": "06 / 实操与展望", "title": "让 AI 能力留下来，而不是让对话结束", "sub": "现状：从真实项目沉淀共享研发资产；下一步：扩大可验证采纳", "body": "<div class=\"flow\"><div><b>个人实践<\/b><span>业务与疑难攻关<\/span><\/div><div><b>共享资产<\/b><span>规范、任务、工具<\/span><\/div><div><b>团队使用<\/b><span>独立完成与反馈<\/span><\/div><div><b>组织推广<\/b><span>入库、标准与带教<\/span><\/div><\/div><div class=\"call\">推广边界：清晰规格、可测试模块优先；复杂交易、权限、生产变更仍需专业研发人员决策。<\/div><p class=\"muted\">尚待验证：跨成员采纳、Vibe Coding真实操作、公司级入库、带教效果和量化收益。<\/p>", "notes": "结尾不要承诺任意规模全自动。强调已验证事实与后续计划：让共享资产真正由其他人独立使用。", "need": "补真实采用记录、培训材料和人员独立任务证据；确认产品化方向属于规划。", "ev": "08/09/12 · 竞赛加分项", "t": 17}, {"ch": "附录 / 备答", "title": "附录｜技术深度与边界", "sub": "答辩备查，不计入15分钟正文", "body": "<div class=\"cards\"><article><small>01<\/small><h3>核销 / 退款并发<\/h3><p>共享 owner-token 租约、Lua 校验释放、DB状态条件更新；压力测试结果待补。<\/p><\/article><article><small>02<\/small><h3>Kingbase 适配<\/h3><p>不可改底层框架，保留配置与插件、精确过滤特定jar XML；存在部分回滚。<\/p><\/article><article><small>03<\/small><h3>Super App 协作<\/h3><p>67张任务快照，55 done/12 blocked；AI角色不能当真人，测试自述需原始输出。<\/p><\/article><article><small>04<\/small><h3>音视频攻关<\/h3><p>领导推荐方向；本轮没有足够完整的AI证据链，待补真实日志与耗时。<\/p><\/article><\/div>", "notes": "答辩时按问答选用，不以技术数量替代主线。", "need": "补音视频案例、兼容矩阵及真实日志，如证据充分可替换出票或库存案例。", "ev": "05/03 · FZ010 / SY005–007 / AI003–007", "t": 0}, {"ch": "附录 / 备答", "title": "附录｜评分与补证优先级", "sub": "优先填补能决定是否成立的核心结论", "body": "<table><thead><tr><th>优先级<\/th><th>补证任务<\/th><th>对应评分<\/th><\/tr><\/thead><tbody><tr><td>P0<\/td><td>本人贡献、需求来源、上线现状与授权<\/td><td>真实性<\/td><\/tr><tr><td>P0<\/td><td>Vibe Coding真人操作、共享规范采纳、带教<\/td><td>工具链、团队加分<\/td><\/tr><tr><td>P0<\/td><td>权限角色回归、库存真实运行与独立演示<\/td><td>AI深度、调试、真实性<\/td><\/tr><tr><td>P1<\/td><td>前端任务同口径对照、AI占比与返工<\/td><td>页面与组件、效能<\/td><\/tr><tr><td>P1<\/td><td>资产入库、跨项目消费、正式评分版本<\/td><td>复用推广、答辩<\/td><\/tr><\/tbody><\/table>", "notes": "当前源材料是脱敏审计报告， ').textContent='继续计时'}else{start=Date.now();$('timer').textContent='暂停计时'}};setInterval(()=>{let n=Math.floor((elapsed+(start?Date.now()-start:0))/1000);$('clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');$('clock').style.color=n>=900?'#ffac95':''},250);$('export').onclick=()=>{let t=slides.map((s,n)=>'## '+(n+1)+' '+s.title.replace(/<[^>]+>/g,' ')+'\n'+(localStorage.getItem(key(n))||'（未补充）')).join('\n\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown;charset=utf-8'}));a.download='AI竞赛-逐页补充.md';a.click();URL.revokeObjectURL(a.href)};document.addEventListener('keydown',e=>{if(['TEXTAREA','INPUT','SELECT'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(i+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='n')mode()});window.addEventListener('resize',fit);render()</script></body></html>
